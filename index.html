<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chronicles of Blight</title>
  <style>
    :root {
      --bg: #120F1D;
      --card: #1B162B;
      --accent: #8B5CF6;
      --text: #F8F7FC;
      --text-muted: #9CA3AF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    /* Meters */
    .meters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      margin-bottom: 20px;
    }
    .meter {
      background: var(--card);
      border-radius: 10px;
      padding: 8px 4px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .meter-icon { font-size: 1.2rem; }
    .bar-bg { background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
    
    /* Card Stage */
    .card-stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(139, 92, 246, 0.3);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      border-radius: 20px;
      width: 100%;
      padding: 24px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .avatar { font-size: 4rem; margin-bottom: 8px; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .card-text { font-size: 0.95rem; color: var(--text-muted); line-height: 1.4; }
    
    /* Choice Buttons */
    .choices {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 20px;
    }
    .choice-btn {
      flex: 1;
      background: var(--card);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: var(--text);
      padding: 14px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .choice-btn:active { background: var(--accent); transform: scale(0.96); }
    .days { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="days" id="days">Days Survived: 1</div>

  <div class="meters">
    <div class="meter"><span class="meter-icon">⚔️</span><div class="bar-bg"><div class="bar-fill" id="m0" style="width:50%"></div></div></div>
    <div class="meter"><span class="meter-icon">🪙</span><div class="bar-bg"><div class="bar-fill" id="m1" style="width:50%"></div></div></div>
    <div class="meter"><span class="meter-icon">🕯️</span><div class="bar-bg"><div class="bar-fill" id="m2" style="width:50%"></div></div></div>
    <div class="meter"><span class="meter-icon">👥</span><div class="bar-bg"><div class="bar-fill" id="m3" style="width:50%"></div></div></div>
  </div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="avatar" id="avatar">🧙‍♂️</div>
      <div class="card-title" id="title">Court Diviner</div>
      <div class="card-text" id="desc">"The spirits warn of famine. Should we drain the treasury to bless the crops?"</div>
    </div>
  </div>

  <div class="choices">
    <button class="choice-btn" id="leftBtn">Bless Crops</button>
    <button class="choice-btn" id="rightBtn">Refuse</button>
  </div>

  <script>
    let stats = [50, 50, 50, 50]; // Might, Coin, Spirit, People
    let day = 1;

    const DECK = [
      {
        avatar: "🧙‍♂️", title: "Court Diviner", text: "The river spirits demand a tithe for bountiful harvest.",
        left: { text: "Pay Tithe", mod: [0, -15, +20, +10] },
        right: { text: "Ignore Spirits", mod: [0, +10, -20, -10] }
      },
      {
        avatar: "🛡️", title: "General", text: "Bandits roam the outer provinces. Send the legion?",
        left: { text: "Send Legion", mod: [-10, -10, 0, +20] },
        right: { text: "Leave Them", mod: [+10, +5, 0, -20] }
      },
      {
        avatar: "🧝‍♀️", title: "Alchemist", text: "I discovered a volatile powder that could fortify weapons.",
        left: { text: "Fund Project", mod: [+20, -20, 0, 0] },
        right: { text: "Too Dangerous", mod: [-5, 0, +10, 0] }
      },
      {
        avatar: "👑", title: "Merchant Guild", text: "Lower trade tariffs, and we will share our foreign riches.",
        left: { text: "Lower Tariffs", mod: [-5, +25, 0, -10] },
        right: { text: "Keep High Taxes", mod: [0, -10, 0, +15] }
      }
    ];

    let currentCard = DECK[0];

    function update() {
      document.getElementById('days').innerText = `Days Survived: ${day}`;
      for (let i = 0; i < 4; i++) {
        document.getElementById(`m${i}`).style.width = `${Math.max(0, Math.min(100, stats[i]))}%`;
      }

      for (let s of stats) {
        if (s <= 0 || s >= 100) {
          alert(`Your journey ends! Survived ${day} days.`);
          stats = [50, 50, 50, 50];
          day = 1;
        }
      }

      currentCard = DECK[Math.floor(Math.random() * DECK.length)];
      document.getElementById('avatar').innerText = currentCard.avatar;
      document.getElementById('title').innerText = currentCard.title;
      document.getElementById('desc').innerText = currentCard.text;
      document.getElementById('leftBtn').innerText = currentCard.left.text;
      document.getElementById('rightBtn').innerText = currentCard.right.text;
    }

    function choose(choice) {
      for (let i = 0; i < 4; i++) stats[i] += choice.mod[i];
      day++;
      update();
    }

    document.getElementById('leftBtn').onclick = () => choose(currentCard.left);
    document.getElementById('rightBtn').onclick = () => choose(currentCard.right);

    update();
  </script>
</body>
</html>
